<div class="navbar fixed top-0 left-0 z-50 w-full transition-all duration-300" [ngClass]="{
  'bg-white/80 shadow-lg shadow-black/5 backdrop-blur': scrolled,
  'bg-transparent': !scrolled
}">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4">
        <a href="#hero" class="text-lg font-semibold tracking-[0.3em] text-gray-900 uppercase">
            Erik<span class="text-pink-500">.</span>dev
        </a>

        <div class="flex items-center gap-2">
            <ul class="menu menu-horizontal hidden px-1 text-sm md:flex">
                <li><a href="#sobre-mi" class="text-gray-600 hover:text-gray-900">Sobre mí</a></li>
                <li><a href="#stack" class="text-gray-600 hover:text-gray-900">Mi stack</a></li>
                <li><a href="#proyectos" class="text-gray-600 hover:text-gray-900">Proyectos</a></li>
            </ul>
            <a href="#contacto" class="btn btn-primary btn-sm">Contactar</a>
            <button type="button" (click)="toggleTheme()" [attr.aria-pressed]="isDarkMode"
                class="inline-flex items-center gap-2 rounded-full border border-gray-200 bg-white/90 px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm transition hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900/90 dark:text-white">
                <span class="text-base">{{ isDarkMode ? '☀️' : '🌙' }}</span>
            </button>
        </div>
    </div>
</div>
